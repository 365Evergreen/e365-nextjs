name: Azure Static Web Apps CI/CD (Scheduled Publishing)

on:
  # Triggers a build when code is pushed to the main branch
  push:
    branches:
      - master
  
  # Triggers a build when a Pull Request is opened or modified against the main branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

  # 📅 Handles Scheduled Publishing 
  # This cron job runs every 3 hours (at minute 0 of every 3rd hour)
  # Change '0 */3 * * *' to '0 0 * * *' if you want it to build only once a day at midnight UTC
  schedule:
    - cron: '0 */3 * * *'

jobs:
  build_and_deploy_job:
    # Only run the job on active branches/schedules, skipping closed pull requests unless they are being merged
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    
    steps:
      # Step 1: Check out your repository code
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Keeps compatibility with the latest Next.js versions
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build and Deploy the static assets to Azure SWA
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Required secret provided automatically by Azure SWA linkage
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Deployment configurations
          action: "upload"
          app_location: "/"       # Location of your Next.js project application
          api_location: ""        # Left blank as you are using Next.js with output: 'export'
          output_location: "out"  # Next.js static export default directory name
          
          # Custom build command requested by your architecture configuration
          app_build_command: "npm run build"

        # Inject environment variables required by Next.js during `npm run build` static generation
        env:
          WORDPRESS_GRAPHQL_ENDPOINT: "https://ivory-wasp-632456.hostingersite.com/graphql"
          NEXT_PUBLIC_WORDPRESS_GRAPHQL_ENDPOINT: "https://ivory-wasp-632456.hostingersite.com/graphql"
          SITE_URL: "https://gray-mushroom-0a58bfe1e.1.azurestaticapps.net"

  # Job to cleanly handle closing out pull request preview environments in Azure SWA
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepr
        uses: Azure/static-web-apps-deploy@v1
        with:
          app_location: "/src/app"       # Location of your Next.js project application
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
